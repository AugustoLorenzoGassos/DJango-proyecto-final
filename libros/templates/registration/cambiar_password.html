{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 card p-4">
        <h3 class="card-title text-center mb-3">Cambiar Contraseña</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning w-100">Guardar Cambios</button>
        </form>
    </div>
</div>
{% endblock %}
