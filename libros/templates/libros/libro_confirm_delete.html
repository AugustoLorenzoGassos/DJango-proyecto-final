{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 card p-4 text-center">
        <h3>¿Deseas eliminar el libro "{{ object.titulo }}"?</h3>
        <p class="text-muted">Esta acción no se puede deshacer.</p>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Sí</button>
            <a href="{% url 'libro_detail' object.pk %}" class="btn btn-secondary">No</a>
        </form>
    </div>
</div>
{% endblock %}
