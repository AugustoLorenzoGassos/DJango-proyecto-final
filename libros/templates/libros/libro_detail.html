{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title">{{ libro.titulo }}</h2>
                <hr>
                <p class="card-text"><strong>Descripción:</strong></p>
                <p>{{ libro.descripcion }}</p>
                <p><strong>Categoría:</strong> {{ libro.categoria.titulo }}</p>
                <p><strong>Estado:</strong> {{ libro.estado.titulo }}</p>
                <p class="text-muted"><small>Creado el: {{ libro.fecha_creacion|date:"d/m/Y H:i" }}</small></p>
                <hr>
                <a href="{% url 'libro_update' libro.pk %}" class="btn btn-warning me-2">Editar</a>
                <a href="{% url 'libro_delete' libro.pk %}" class="btn btn-danger me-2">Eliminar</a>
                <a href="{% url 'libro_list' %}" class="btn btn-secondary">Volver a la lista</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
